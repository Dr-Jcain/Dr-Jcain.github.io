name: Actualizar datos de JCain Engineering

on:
  workflow_dispatch:
  push:
    paths:
      - "cursos/**"
      - "site.config.json"
      - "scripts/build_site.py"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerar datos del sitio
        run: python scripts/build_site.py
      - name: Guardar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-data.js assets/data/site-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos generados de JCain Engineering"
            git push
          fi
